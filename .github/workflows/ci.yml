name: PEREZ AI CI

on:
  push:
    branches: [main, 'devops/**', 'fix/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perez-ai-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_MODE: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile every Python module
        run: python -m py_compile main.py $(find src tests -name '*.py' -type f)

      - name: Run full test suite
        run: python -m pytest -q

      - name: PROVE closed paper trade reaches AI memory exactly once
        run: python -m pytest -q tests/test_learning_integrity.py -vv

      - name: Verify paper-only runtime safety
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'placeOrder|placeOrderFullResponse|modifyOrder|cancelOrder' main.py src --include='*.py'; then
            echo 'ERROR: live-order API primitive detected'
            exit 1
          fi
          python - <<'PY'
          import main
          assert main.PAPER_MODE is True, 'PAPER_MODE must default to true'
          print('PAPER_MODE_DEFAULT_SAFE=true')
          PY

      - name: Verify no tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'; then
            echo 'ERROR: credential/private-key file is tracked'
            exit 1
          fi
          echo 'TRACKED_SECRET_FILE_CHECK=PASS'
