name: PEREZ AI Core Validation

on:
  push:
    branches:
      - devops/iq200-hardening
  workflow_dispatch:

concurrency:
  group: perez-ai-core-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core bot tests and paper safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_MODE: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile core runtime
        run: python -m py_compile main.py $(find src -name '*.py' -type f)

      - name: Run core tests
        run: >-
          python -m pytest -q
          tests/test_core_smoke.py
          tests/test_upgrades.py
          tests/test_paper_exit.py
          tests/test_multi_timeframe.py

      - name: Enforce paper-only safety
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'placeOrder|placeOrderFullResponse|modifyOrder|cancelOrder' main.py src --include='*.py'; then
            echo 'ERROR: live-order API primitive detected'
            exit 1
          fi
          python - <<'PY'
          import main
          assert main.PAPER_MODE is True
          print('PAPER_MODE_DEFAULT_SAFE=true')
          PY

      - name: Check tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'; then
            echo 'ERROR: credential/private-key file is tracked'
            exit 1
          fi
          echo 'TRACKED_SECRET_FILE_CHECK=PASS'

  legacy-audit:
    name: Legacy module audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Report legacy import failures
        run: |
          python - <<'PY'
          import importlib
          modules = [
              'src.candles', 'src.check_contract', 'src.elcid_live_nav',
              'src.fundamental_research_engine', 'src.live_market',
              'src.live_quote', 'src.live_scanner',
              'src.market_scanner_backup', 'src.market_scanner_v2',
              'src.refresh_hidden_value_source', 'src.scanner',
              'src.web_research',
          ]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append((name, type(exc).__name__, str(exc)))
          print(f'LEGACY_IMPORT_FAILURES={len(failed)}')
          for row in failed:
              print(row)
          PY
