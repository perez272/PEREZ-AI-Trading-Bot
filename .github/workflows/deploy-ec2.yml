name: Deploy PEREZ AI to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: perez-ai-ec2-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Pre-deploy tests and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_MODE: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile repository
        run: python -m py_compile main.py $(find src tests -name '*.py' -type f)

      - name: Run full test suite
        run: python -m pytest -q

      - name: Enforce paper-only safety
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'placeOrder|placeOrderFullResponse|modifyOrder|cancelOrder' main.py src --include='*.py'; then
            echo 'ERROR: live-order API primitive detected'
            exit 1
          fi
          python - <<'PY'
          import main
          assert main.PAPER_MODE is True, 'PAPER_MODE must default to true'
          print('PAPER_MODE_DEFAULT_SAFE=true')
          PY

      - name: Check tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'; then
            echo 'ERROR: credential/private-key file is tracked'
            exit 1
          fi
          echo 'TRACKED_SECRET_FILE_CHECK=PASS'

  deploy:
    needs: preflight
    runs-on: [self-hosted, linux, x64, perez-ai-ec2]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository syntax
        run: |
          set -euo pipefail
          python3 -m py_compile main.py $(find src -name '*.py' -type f)

      - name: Transactional deploy with automatic rollback
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot

          PREV_SHA=$(git rev-parse HEAD)
          BACKUP_DIR="data/runtime/deploy-backup-${GITHUB_RUN_ID}"
          mkdir -p "$BACKUP_DIR"
          printf '%s\n' "$PREV_SHA" > "$BACKUP_DIR/previous_sha"
          if test -f /etc/systemd/system/perez-ai.service; then
            sudo cp /etc/systemd/system/perez-ai.service "$BACKUP_DIR/perez-ai.service"
          fi

          rollback() {
            echo "DEPLOY_FAILED — starting automatic rollback to $PREV_SHA"
            git reset --hard "$PREV_SHA" || true
            if test -f "$BACKUP_DIR/perez-ai.service"; then
              sudo install -m 0644 "$BACKUP_DIR/perez-ai.service" /etc/systemd/system/perez-ai.service || true
              sudo systemctl daemon-reload || true
            fi
            sudo systemctl restart perez-ai.service || true
            sleep 8
            if systemctl is-active --quiet perez-ai.service; then
              echo "ROLLBACK_OK=true"
            else
              echo "ROLLBACK_OK=false"
            fi
          }
          trap rollback ERR

          git fetch origin
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          test -f .env
          test -x venv/bin/python
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m py_compile main.py $(find src -name '*.py' -type f)
          venv/bin/python -m pytest -q

          for unit in perez-market-open.service perez-ai-bot.service perez-paper-monitor.service; do
            sudo systemctl disable --now "$unit" 2>/dev/null || true
          done
          sudo rm -f /etc/systemd/system/perez-market-open.service /etc/systemd/system/perez-ai-bot.service /etc/systemd/system/perez-paper-monitor.service

          sudo install -m 0644 deploy/systemd/perez-ai.service /etc/systemd/system/perez-ai.service
          sudo systemctl daemon-reload
          sudo systemctl enable perez-ai.service
          sudo systemctl restart perez-ai.service
          sleep 8

          systemctl is-active --quiet perez-ai.service
          if test -f data/runtime/heartbeat.json; then
            python3 - <<'PY'
          import json, time
          from pathlib import Path
          p = Path('data/runtime/heartbeat.json')
          data = json.loads(p.read_text())
          age = time.time() - float(data['epoch'])
          print(f"CANARY_HEARTBEAT_AGE_SECONDS={age:.1f}")
          if age > 120:
              raise SystemExit('CANARY_STALE_HEARTBEAT')
          PY
          fi

          trap - ERR
          echo "DEPLOY_OK"
          echo "HOST=$(hostname)"
          echo "PREVIOUS_COMMIT=$PREV_SHA"
          echo "CURRENT_COMMIT=$(git rev-parse HEAD)"
          echo "ROLLBACK_CAPABLE=true"

      - name: Verify paper safety
        run: |
          set -euo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          if grep -RniE 'placeOrder|placeOrderFullResponse|modifyOrder|cancelOrder' src main.py --include='*.py'; then
            echo "ERROR: live-order API usage detected"
            exit 1
          fi
          if grep -RniE 'LIVE ORDERS.*(TRUE|ENABLED)' main.py src 2>/dev/null; then
            echo "ERROR: live trading flag appears enabled"
            exit 1
          fi
          echo "PAPER_SAFETY_CHECK_COMPLETE"

      - name: Check runtime services and duplicate processes
        run: |
          set -euo pipefail
          echo "--- PEREZ systemd services ---"
          systemctl list-units --all --type=service --no-legend 'perez*' || true
          echo "--- PEREZ processes ---"
          pgrep -af 'PEREZ-AI-Trading-Bot.*main.py|python.*main.py' || true
          echo "--- runtime heartbeat ---"
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          if test -f data/runtime/heartbeat.json; then cat data/runtime/heartbeat.json; else echo "HEARTBEAT_NOT_YET_CREATED"; fi
          echo "--- recent journal ---"
          journalctl --no-pager -n 80 -u perez-ai.service 2>/dev/null || true

      - name: Check freshness and runtime errors
        run: |
          set -euo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          if test -f data/runtime/heartbeat.json; then
            python3 - <<'PY'
          import json, time
          from pathlib import Path
          p = Path('data/runtime/heartbeat.json')
          data = json.loads(p.read_text())
          age = time.time() - float(data['epoch'])
          print(f"HEARTBEAT_AGE_SECONDS={age:.1f}")
          if age > 120:
              raise SystemExit('STALE_HEARTBEAT')
          PY
          fi
          if journalctl --no-pager -u perez-ai.service 2>/dev/null | grep -F "Monitor error: 'remaining_quantity'"; then
            echo "ERROR: legacy remaining_quantity monitor failure detected"
            exit 1
          fi
          for unit in perez-market-open.service perez-ai-bot.service perez-paper-monitor.service; do
            if systemctl is-active --quiet "$unit"; then
              echo "ERROR: retired $unit is still active"
              exit 1
            fi
          done
          if ! systemctl is-active --quiet perez-ai.service; then
            echo "ERROR: perez-ai.service is not active"
            exit 1
          fi
          echo "RUNTIME_ERROR_CHECK_COMPLETE"
