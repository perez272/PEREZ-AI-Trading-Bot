name: Deploy PEREZ AI to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: perez-ai-ec2-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, perez-ai-ec2]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository syntax
        run: |
          set -euo pipefail
          python3 -m py_compile main.py $(find src -name '*.py' -type f)

      - name: Deploy locally on EC2
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          git fetch origin
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          test -f .env
          test -x venv/bin/python
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m py_compile main.py $(find src -name '*.py' -type f)
          venv/bin/python -m pytest -q

          # One production owner only. main.py owns scanning, paper execution,
          # and the per-trade LTP monitor. Legacy market-open/bot/monitor units
          # are retired so they cannot create duplicate processes or restart loops.
          for unit in perez-market-open.service perez-ai-bot.service perez-paper-monitor.service; do
            sudo systemctl disable --now "$unit" 2>/dev/null || true
          done
          sudo rm -f /etc/systemd/system/perez-market-open.service /etc/systemd/system/perez-ai-bot.service /etc/systemd/system/perez-paper-monitor.service

          # Install every PEREZ-owned systemd unit from the repository so EC2
          # cannot drift into a configuration that is absent from source control.
          sudo install -m 0644 deploy/systemd/perez-ai.service /etc/systemd/system/perez-ai.service
          sudo install -m 0644 deploy/systemd/perez-ai-health.service /etc/systemd/system/perez-ai-health.service
          sudo install -m 0644 deploy/systemd/perez-ai-health.timer /etc/systemd/system/perez-ai-health.timer
          sudo systemctl daemon-reload
          sudo systemctl enable perez-ai.service
          sudo systemctl enable --now perez-ai-health.timer
          sudo systemctl restart perez-ai.service
          sudo systemctl start perez-ai-health.service || true

          echo "DEPLOY_OK"
          echo "HOST=$(hostname)"
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "STATIC_IP_NOT_REQUIRED=true"

      - name: Verify paper safety
        run: |
          set -euo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          if grep -RniE 'placeOrder|placeOrderFullResponse|modifyOrder|cancelOrder' src main.py; then
            echo "ERROR: live-order API usage detected"
            exit 1
          fi
          if grep -RniE 'LIVE ORDERS.*(TRUE|ENABLED)' main.py src 2>/dev/null; then
            echo "ERROR: live trading flag appears enabled"
            exit 1
          fi
          grep -RniE 'LIVE ORDERS.*(FALSE|DISABLED)|PAPER.*(TRUE|ENABLED)' main.py src --exclude-dir=__pycache__ | head -20 || true
          echo "PAPER_SAFETY_CHECK_COMPLETE"

      - name: Check runtime services and duplicate processes
        run: |
          set -euo pipefail
          echo "--- PEREZ systemd services ---"
          systemctl list-units --all --type=service --no-legend 'perez*' || true
          echo "--- PEREZ timers ---"
          systemctl list-timers --all --no-legend 'perez*' || true
          echo "--- PEREZ processes ---"
          pgrep -af 'PEREZ-AI-Trading-Bot.*main.py|python.*main.py' || true
          echo "--- runtime heartbeat ---"
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          if test -f data/runtime/heartbeat.json; then cat data/runtime/heartbeat.json; else echo "HEARTBEAT_NOT_YET_CREATED"; fi
          echo "--- health journal ---"
          journalctl --no-pager -n 40 -u perez-ai-health.service 2>/dev/null || true
          echo "--- recent main journal ---"
          journalctl --no-pager -n 80 -u perez-ai.service 2>/dev/null || true

      - name: Check freshness and runtime errors
        run: |
          set -euo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          if test -f data/runtime/heartbeat.json; then
            python3 - <<'PY'
          import json, time
          from pathlib import Path
          p = Path('data/runtime/heartbeat.json')
          data = json.loads(p.read_text())
          age = time.time() - float(data['epoch'])
          print(f"HEARTBEAT_AGE_SECONDS={age:.1f}")
          if age > 120:
              raise SystemExit('STALE_HEARTBEAT')
          PY
          fi
          if journalctl --no-pager -u perez-ai.service 2>/dev/null | grep -F "Monitor error: 'remaining_quantity'"; then
            echo "ERROR: legacy remaining_quantity monitor failure detected"
            exit 1
          fi
          for unit in perez-market-open.service perez-ai-bot.service perez-paper-monitor.service; do
            if systemctl is-active --quiet "$unit"; then
              echo "ERROR: retired $unit is still active"
              exit 1
            fi
          done
          if ! systemctl is-active --quiet perez-ai.service; then
            echo "ERROR: perez-ai.service is not active"
            exit 1
          fi
          if ! systemctl is-enabled --quiet perez-ai-health.timer; then
            echo "ERROR: perez-ai-health.timer is not enabled"
            exit 1
          fi
          if ! systemctl is-active --quiet perez-ai-health.timer; then
            echo "ERROR: perez-ai-health.timer is not active"
            exit 1
          fi
          echo "RUNTIME_ERROR_CHECK_COMPLETE"
