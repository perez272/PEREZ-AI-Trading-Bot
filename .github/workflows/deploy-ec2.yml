name: Deploy PEREZ AI to EC2

on:
  push:
    branches:
      - ec2-sync-20260815-recovery
  workflow_dispatch:

concurrency:
  group: perez-ai-ec2-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: |
          python3 -m py_compile main.py $(find src -name '*.py' -type f)

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/perez_ai_ec2
          chmod 600 ~/.ssh/perez_ai_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/perez_ai_ec2 "$EC2_USER@$EC2_HOST" "bash -s" <<EOF
          set -euo pipefail
          cd /home/ubuntu/PEREZ-AI-Trading-Bot
          git fetch origin
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          test -f .env
          test -x venv/bin/python
          venv/bin/python -m py_compile main.py \$(find src -name '*.py' -type f)
          echo "DEPLOY_OK"
          EOF
