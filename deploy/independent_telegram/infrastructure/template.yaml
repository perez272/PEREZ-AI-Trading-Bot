AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Independent Telegram status service for PEREZ AI

Parameters:
  TelegramTokenSecretArn:
    Type: String
  TelegramChatId:
    Type: String
  RemoteStatusToken:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TelegramFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          TELEGRAM_TOKEN_SECRET: !Ref TelegramTokenSecretArn
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          REMOTE_STATUS_TOKEN: !Ref RemoteStatusToken
          HEARTBEAT_TTL_SECONDS: '180'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TelegramTokenSecretArn
      Events:
        State:
          Type: Api
          Properties:
            Path: /state
            Method: post
        Telegram:
          Type: Api
          Properties:
            Path: /telegram
            Method: post

Outputs:
  TelegramApiUrl:
    Description: API Gateway base URL; append /telegram or /state
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
